name: botzone

x-app-environment: &app-environment
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgres://botzone_app:botzone_app_local@db:5432/botzone
  MIGRATION_DATABASE_URL: postgres://botzone:botzone_local@db:5432/botzone
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-botzone-local-demo-secret-change-for-your-machine-2026}
  DEMO_MODE: "true"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: BotZone <noreply@botzone.local>
  UPLOAD_DIR: /app/uploads

services:
  db:
    image: postgres:18.1-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: botzone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: botzone_admin_local
      TZ: UTC
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d botzone"]
      interval: 3s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.10
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data

  bootstrap:
    image: postgres:18.1-bookworm
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: botzone_admin_local
    entrypoint: ["sh", "-ec"]
    command:
      - |
        psql -h db -U postgres -d botzone -v ON_ERROR_STOP=1 <<'SQL'
        DO $$$$ BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'botzone') THEN
            CREATE ROLE botzone LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'botzone_local';
          END IF;
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'botzone_app') THEN
            CREATE ROLE botzone_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'botzone_app_local';
          END IF;
        END $$$$;
        ALTER DATABASE botzone OWNER TO botzone;
        GRANT ALL ON SCHEMA public TO botzone;
        GRANT CONNECT ON DATABASE botzone TO botzone_app;
        GRANT USAGE ON SCHEMA public TO botzone_app;
        ALTER DEFAULT PRIVILEGES FOR ROLE botzone IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO botzone_app;
        ALTER DEFAULT PRIVILEGES FOR ROLE botzone IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO botzone_app;
        SQL

  migrate:
    image: botzone-local:dev
    build: .
    restart: "no"
    environment: *app-environment
    command: ["npm", "run", "db:migrate"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  app:
    image: botzone-local:dev
    build: .
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  worker:
    image: botzone-local:dev
    build: .
    restart: unless-stopped
    environment: *app-environment
    command: ["npm", "run", "worker"]
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  postgres-data:
  mailpit-data:
